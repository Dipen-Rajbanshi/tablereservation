<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage tables</title>
</head>
<body>
    <h1>Manage tables</h1>

    <p th:if="${error != null}" th:text="${error}" style="color: red;"></p>

    <table border="1" cellpadding="6">
        <tr>
            <th>Table number</th>
            <th>Seats</th>
            <th>Active</th>
            <th></th>
        </tr>
        <tr th:each="t : ${tables}">
            <td th:text="${t.tableNumber}"></td>
            <td th:text="${t.seats}"></td>
            <td th:text="${t.active}"></td>
            <td>
                <form th:action="@{/admin/tables/{id}/toggle(id=${t.id})}" method="post">
                    <button type="submit" th:text="${t.active} ? 'Disable' : 'Enable'"></button>
                </form>
            </td>
        </tr>
    </table>

    <h2>Add a table</h2>
    <form th:action="@{/admin/tables}" method="post">
        <label>Table number: <input type="number" name="tableNumber" min="1" required></label>
        <label>Seats: <input type="number" name="seats" min="1" required></label>
        <button type="submit">Add</button>
    </form>
    <p><a href="/admin/reservations">View reservations</a></p>
    <p><a href="/search">Back to search</a></p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>
</body>
</html>
