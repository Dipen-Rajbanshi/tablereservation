<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My reservations</title>
</head>
<body>
    <h1>My reservations</h1>

    <p th:if="${param.booked != null}" style="color: green;">Your table is booked!</p>

    <p th:if="${reservations.isEmpty()}">You have no reservations yet.</p>

    <table border="1" cellpadding="6" th:unless="${reservations.isEmpty()}">
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Table</th>
            <th>Guests</th>
            <th>Status</th>
        </tr>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.date}"></td>
            <td th:text="${r.startTime}"></td>
            <td th:text="${r.table.tableNumber}"></td>
            <td th:text="${r.guests}"></td>
            <td th:text="${r.status}"></td>
        </tr>
    </table>

    <p><a href="/search">Find a table</a></p>
</body>
</html>
