<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h1>Create an account</h1>

    <!-- Shown after a successful registration -->
        <p th:if="${param.success != null}">Account created! <a href="/login">Log in here</a>.</p>

    <!-- Shown when the controller found a problem -->
    <p th:if="${error != null}" th:text="${error}" style="color: red;"></p>

    <!-- th:action also adds the hidden security token that POST forms need -->
    <form th:action="@{/register}" method="post">
        <p><label>Name: <input type="text" name="name" required></label></p>
        <p><label>Email: <input type="email" name="email" required></label></p>
        <p><label>Password: <input type="password" name="password" minlength="6" required></label></p>
        <button type="submit">Register</button>
    </form>

    <p><a href="/search">Find a table</a></p>
</body>
</html>
