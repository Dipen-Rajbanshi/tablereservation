<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
</head>
<body>
    <h1>Reservations</h1>

    <p th:if="${error != null}" th:text="${error}" style="color: red;"></p>

    <!-- Pick the day to look at -->
    <form action="/admin/reservations" method="get">
        <label>Date: <input type="date" name="date" th:value="${date}" required></label>
        <button type="submit">Show</button>
    </form>

    <h2 th:text="'Reservations on ' + ${date}"></h2>

    <p th:if="${reservations.isEmpty()}">No reservations on this day.</p>

    <table border="1" cellpadding="6" th:unless="${reservations.isEmpty()}">
        <tr>
            <th>Time</th>
            <th>Table</th>
            <th>Guest</th>
            <th>Email</th>
            <th>Guests</th>
            <th>Status</th>
            <th></th>
        </tr>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.startTime}"></td>
            <td th:text="${r.table.tableNumber}"></td>
            <td th:text="${r.user.name}"></td>
            <td th:text="${r.user.email}"></td>
            <td th:text="${r.guests}"></td>
            <td th:text="${r.status}"></td>
            <td>
                <form th:if="${r.status.name() == 'CONFIRMED'}"
                      th:action="@{/admin/reservations/{id}/cancel(id=${r.id})}" method="post">
                    <!-- Remember which day we are looking at -->
                    <input type="hidden" name="date" th:value="${date}">
                    <button type="submit">Cancel</button>
                </form>
            </td>
        </tr>
    </table>

    <p><a href="/admin/tables">Manage tables</a> | <a href="/search">Back to search</a></p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>
</body>
</html>
